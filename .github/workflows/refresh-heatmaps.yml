name: Refresh heatmap snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/refresh_heatmaps.py"
      - "scripts/repair_missing_heatmaps.py"
      - "scripts/refresh_shanghai_sse.py"
      - "requirements.txt"
      - ".github/workflows/refresh-heatmaps.yml"
  schedule:
    - cron: "30 09 * * 1-5"

permissions:
  contents: write

concurrency:
  group: heatmap-snapshot-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install data dependencies
        run: pip install --disable-pip-version-check requests
      - name: Build Shanghai official SSE snapshot
        run: python scripts/refresh_shanghai_sse.py
      - name: Commit Shanghai snapshot
        run: |
          git config user.name "global-market-monitor-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/shanghai.json
          git diff --cached --quiet || git commit -m "data: refresh Shanghai heatmap snapshot"
          git push
